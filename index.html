<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Catalyst Terminal (bilingual)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f17] text-gray-200 font-sans antialiased">

    <!-- Top Navigation Terminal Header -->
    <header class="border-b border-gray-800 bg-[#0f1524]/90 backdrop-blur sticky top-0 z-50 px-6 py-4 shadow-2xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-emerald-600 to-teal-400 p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-chart-line text-xl text-slate-900 font-bold"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-white flex items-center gap-2">
                        NSE LIVE CATALYST ENGINE <span class="text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-2 py-0.5 rounded font-mono animate-pulse">LIVE TERMINAL</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-0.5">Automated Pre-Market Trigger Analysis (English / हिंदी)</p>
                </div>
            </div>
            
            <!-- Real-time Market Benchmark Strip -->
            <div class="flex items-center gap-4 flex-wrap text-xs bg-[#161f33] px-4 py-2 rounded-xl border border-gray-800" id="market-benchmarks">
                <!-- Live index values load here -->
            </div>
        </div>
    </header>

    <!-- Main Board -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        <!-- Live Stream Containment Block -->
        <div id="alerts-stream" class="space-y-6">
            <div class="text-center text-gray-500 py-24">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 block text-emerald-500"></i>
                Connecting to live NSE feed... डेटा लोड हो रहा है...
            </div>
        </div>
    </main>

    <script>
        async function fetchTerminalUpdates() {
            try {
                // Fetch fresh files. Bust the browser cache to get true 1-minute updates
                const res = await fetch('./premarket_feed.json?cache_bust=' + new Date().getTime());
                const data = await res.json();
                
                // 1. Render Macro Benchmark Strip
                const benchmarks = document.getElementById('market-benchmarks');
                benchmarks.innerHTML = `
                    <span class="text-gray-400 font-medium"><i class="fa-solid fa-clock text-emerald-400 mr-1"></i> Update Time: ${new Date(data.lastUpdated).toLocaleTimeString('en-IN')}</span>
                    <span class="w-px h-3 bg-gray-700"></span>
                    <span class="text-gray-300">NIFTY 50: <b class="font-mono text-emerald-400">${data.macro.nifty}</b></span>
                    <span class="text-gray-300">SENSEX: <b class="font-mono text-emerald-400">${data.macro.sensex}</b></span>
                `;

                // 2. Render Macro Catalyst Cards
                const stream = document.getElementById('alerts-stream');
                stream.innerHTML = '';

                data.alerts.forEach(item => {
                    const isBullish = item.sentiment.includes('BULLISH');
                    const primaryColor = isBullish ? 'emerald' : 'rose';
                    const iconType = isBullish ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';
                    
                    let resultsMarkup = '';
                    if(item.quarterlyData) {
                        resultsMarkup = `
                            <div class="mt-4 border border-gray-800/80 rounded-xl overflow-hidden bg-[#0d121f]">
                                <div class="bg-[#131a2e] px-4 py-2 border-b border-gray-800 text-xs font-bold tracking-wider text-gray-300 flex items-center gap-2">
                                    <i class="fa-solid fa-table-list text-teal-400"></i> 5-Quarter Financials (पछले 5 क्वार्टर का नतीजा - ₹ Crores)
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left text-xs font-mono">
                                        <thead class="bg-[#101626] text-gray-400 border-b border-gray-800">
                                            <tr>
                                                <th class="p-3">Financial Metric (पैमाना)</th>
                                                ${item.quarterlyData.quarters.map(q => `<th class="p-3 text-right">${q}</th>`).join('')}
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-gray-800/50">
                                            <tr>
                                                <td class="p-3 font-sans text-gray-400">Total Net Revenue (कुल कमाई)</td>
                                                ${item.quarterlyData.revenue.map(v => `<td class="p-3 text-right text-white font-semibold">₹${v} Cr</td>`).join('')}
                                            </tr>
                                            <tr class="bg-[#101626]/30">
                                                <td class="p-3 font-sans text-gray-400">Net Profit - PAT (शुद्ध मुनाफा)</td>
                                                ${item.quarterlyData.pat.map(v => `<td class="p-3 text-right text-emerald-400 font-semibold">₹${v} Cr</td>`).join('')}
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    }

                    const element = `
                        <div class="bg-[#0f1524] border border-gray-800 rounded-2xl p-6 shadow-xl transition-all duration-300 hover:border-gray-700/70">
                            <!-- Header Info -->
                            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-gray-800 pb-4">
                                <div class="space-y-1.5">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="bg-gray-900 text-gray-400 font-mono text-xs px-2.5 py-1 rounded-md border border-gray-800 font-bold">${item.ticker}</span>
                                        <span class="text-xs text-gray-500 font-mono">ISIN: ${item.isin}</span>
                                    </div>
                                    <h2 class="text-xl font-extrabold text-white tracking-tight">${item.stockName}</h2>
                                    <p class="text-xs text-gray-400 flex items-center gap-1.5">
                                        <i class="fa-solid fa-industry text-teal-400"></i> Sector (सेक्टर): <span class="text-gray-300 font-semibold">${item.sector}</span>
                                    </p>
                                </div>
                                <div class="flex gap-4 items-center bg-[#141c30] p-3 rounded-xl border border-gray-800/80">
                                    <div class="text-right">
                                        <span class="text-[10px] text-gray-400 block uppercase tracking-wider font-bold">CMP (कीमत)</span>
                                        <span class="text-xl font-mono font-black text-white">₹${item.cmp.toFixed(2)}</span>
                                    </div>
                                    <div class="w-px h-8 bg-gray-800"></div>
                                    <div class="text-right">
                                        <span class="text-[10px] text-gray-400 block uppercase tracking-wider font-bold">1W Delivery Vol %</span>
                                        <span class="text-sm font-mono font-bold text-teal-400">${item.deliveryPercentage}%</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Bilingual News Alert Banner -->
                            <div class="mt-4 p-4 rounded-xl border bg-[#111827]/80 ${isBullish ? 'border-emerald-900/50 bg-gradient-to-r from-emerald-950/20 to-transparent' : 'border-rose-900/50 bg-gradient-to-r from-rose-950/20 to-transparent'}">
                                <div class="flex items-center gap-2 mb-2">
                                    <i class="fa-solid ${isBullish ? 'fa-circle-up text-emerald-400' : 'fa-circle-down text-rose-400'} text-base"></i>
                                    <span class="text-xs uppercase font-black tracking-wider ${isBullish ? 'text-emerald-400' : 'text-rose-400'}">
                                        ${item.category} TRIGGER DETECTED | ${isBullish ? 'तेजी की संभावना (Bullish)' : 'मंदी की संभावना (Bearish)'}
                                    </span>
                                </div>
                                <p class="text-sm text-gray-200 leading-relaxed font-medium mb-3">${item.triggerNewsEnglish}</p>
                                <div class="border-t border-gray-800/60 my-2 pt-2"></div>
                                <p class="text-sm text-emerald-300 font-medium leading-relaxed bg-slate-950/40 p-2.5 rounded border border-slate-900"><b class="text-xs text-slate-400 block mb-0.5 font-sans">सरल हिंदी विश्लेषण (Hindi Analysis):</b>${item.triggerNewsHindi}</p>
                            </div>

                            <!-- Financial Statistics Matrix Grid -->
                            <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="bg-[#131b2e] p-3 rounded-xl border border-gray-800/60">
                                    <span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block mb-1"><i class="fa-solid fa-scale-balanced text-teal-400 mr-1"></i> Performance (परफॉरमेंस Comparison)</span>
                                    <div class="text-xs space-y-1 font-mono">
                                        <div class="flex justify-between"><span>Stock (शेयर):</span><span class="${item.performance.stock >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${item.performance.stock}%</span></div>
                                        <div class="flex justify-between"><span>Sector (सेक्टर):</span><span class="${item.performance.sector >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${item.performance.sector}%</span></div>
                                        <div class="flex justify-between"><span>Nifty Index:</span><span class="${item.performance.index >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${item.performance.index}%</span></div>
                                    </div>
                                </div>
                                <div class="bg-[#131b2e] p-3 rounded-xl border border-gray-800/60">
                                    <span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block mb-1"><i class="fa-solid fa-building-columns text-teal-400 mr-1"></i> FII / DII Accumulation (बड़े निवेशक)</span>
                                    <div class="text-xs space-y-1 font-mono">
                                        <div class="flex justify-between"><span>FII Holdings:</span><span class="text-white font-bold">${item.institutionalHoldings.fii}%</span></div>
                                        <div class="flex justify-between"><span>DII Holdings:</span><span class="text-white font-bold">${item.institutionalHoldings.dii}%</span></div>
                                        <div class="text-[10px] text-gray-500 mt-1 truncate">ट्रेंड: ${item.institutionalHoldings.trend}</div>
                                    </div>
                                </div>
                                <div class="bg-[#131b2e] p-3 rounded-xl border border-gray-800/60 flex flex-col justify-between">
                                    <div>
                                        <span class="text-[10px] uppercase font-bold tracking-wider text-gray-400 block mb-0.5"><i class="fa-solid fa-bullseye text-teal-400 mr-1"></i> Intraday Volatility Boundary</span>
                                        <span class="text-[11px] text-gray-400 block font-sans">अनुमानित इंट्राडे रेंज (Target Range):</span>
                                    </div>
                                    <div class="text-base font-mono font-black tracking-wide ${isBullish ? 'text-emerald-400' : 'text-rose-400'} mt-1">
                                        ₹${item.predictionRange.low.toFixed(2)} ➔ ₹${item.predictionRange.high.toFixed(2)}
                                    </div>
                                </div>
                            </div>

                            <!-- Consolidated Financial Data Table Section -->
                            ${resultsMarkup}
                        </div>
                    `;
                    stream.innerHTML += element;
                });

            } catch (err) {
                console.error("Data refresh cycle encounter:", err);
            }
        }

        // Initialize execution loops
        window.onload = () => {
            fetchTerminalUpdates();
            setInterval(fetchTerminalUpdates, 60000); // 60 seconds interval tracking loop
        };
    </script>
</body>
</html>
