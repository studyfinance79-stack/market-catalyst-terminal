<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Catalyst Terminal (Bilingual)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* This creates the smooth pulsing/blinking effect for your trading signals */
        @keyframes pulseBlink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(0.99); }
            100% { opacity: 1; transform: scale(1); }
        }
        .blink-action {
            animation: pulseBlink 1.2s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-[#0b0f17] text-gray-200 font-sans antialiased">

    <header class="border-b border-gray-800 bg-[#0f1524]/90 backdrop-blur sticky top-0 z-50 px-6 py-4 shadow-2xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-emerald-600 to-teal-400 p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-chart-line text-xl text-slate-900 font-bold"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-white flex items-center gap-2">
                        NSE LIVE CATALYST ENGINE <span class="text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-2 py-0.5 rounded font-mono animate-pulse">LIVE TERMINAL</span>
                    </h1>
                    <p class="text-xs text-gray-400 mt-0.5">Automated Pre-Market Trigger Analysis (English / हिंदी)</p>
                </div>
            </div>
            <div class="flex items-center gap-4 flex-wrap text-xs bg-[#161f33] px-4 py-2 rounded-xl border border-gray-800" id="market-benchmarks">
                </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <div id="main-catalyst-panel" class="lg:col-span-3 space-y-6">
                <div class="text-center text-gray-500 py-24">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 block text-emerald-500"></i>
                    Connecting to live NSE feed... डेटा लोड हो रहा है...
                </div>
            </div>

            <div class="lg:col-span-1 bg-[#0f1524] border border-gray-800 rounded-2xl p-4 shadow-xl h-[550px] sticky top-24 flex flex-col">
                <h3 class="text-white font-black text-xs uppercase tracking-wider border-b border-gray-800 pb-3 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-newspaper text-teal-400"></i> Today's News Stream
                </h3>
                <div id="sidebar-news-stream" class="space-y-3 overflow-y-auto flex-1 pr-1">
                    </div>
            </div>

        </div>
    </main>

    <script>
        async function fetchTerminalUpdates() {
            try {
                const res = await fetch('./premarket_feed.json?cache_bust=' + new Date().getTime());
                const data = await res.json();
                
                // 1. Render Macro Benchmark Strip
                const benchmarks = document.getElementById('market-benchmarks');
                benchmarks.innerHTML = `
                    <span class="text-gray-400 font-medium"><i class="fa-solid fa-clock text-emerald-400 mr-1"></i> Update Time: ${new Date(data.lastUpdated).toLocaleTimeString('en-IN')}</span>
                    <span class="w-px h-3 bg-gray-700"></span>
                    <span class="text-gray-300">NIFTY 50: <b class="font-mono text-emerald-400">${data.macro.nifty}</b></span>
                    <span class="text-gray-300">SENSEX: <b class="font-mono text-emerald-400">${data.macro.sensex}</b></span>
                `;

                // 2. Render Main Left Panel and Right Sidebar Chronology
                const mainPanel = document.getElementById('main-catalyst-panel');
                const sidebarStream = document.getElementById('sidebar-news-stream');
                
                mainPanel.innerHTML = '';
                sidebarStream.innerHTML = '';

                data.alerts.forEach((item, index) => {
                    const isBullish = item.sentiment.includes('BULLISH');
                    
                    // Setup conditions for Bullish (Good) vs Bearish (Bad) fields dynamically
                    const alertTitle = isBullish ? '🐂 GOOD NEWS' : '🐻 BAD NEWS';
                    const alertColorClass = isBullish ? 'text-emerald-400' : 'text-rose-400';
                    const alertBgClass = isBullish ? 'border-emerald-900/50 bg-gradient-to-r from-emerald-950/20 to-transparent' : 'border-rose-900/50 bg-gradient-to-r from-rose-950/20 to-transparent';
                    const signalText = isBullish 
                        ? `⚡ INTRADAY TRADING : LONG BUY FOR DATE 03.06.2026 ⚡` 
                        : `⚡ INTRADAY TRADING : SHORT SELL FOR DATE 03.06.2026 ⚡`;
                    
                    const expertOpinionText = isBullish
                        ? `Stock will take a <span class="text-emerald-400 font-bold">Bullish Jump</span>. Prices on Intraday are highly expected to clear local resistance levels and trend upward from CMP <span class="font-bold">₹${item.cmp.toFixed(2)}</span> to test target boundaries near <span class="text-emerald-400 font-black text-base">₹${item.predictionRange.high.toFixed(2)}</span> during today's session.`
                        : `Stock will face a <span class="text-rose-400 font-bold">Bearish Dive</span>. Prices on Intraday are expected to break lower support markers and slide down from CMP <span class="font-bold">₹${item.cmp.toFixed(2)}</span> to test bottom boundaries near <span class="text-rose-400 font-black text-base">₹${item.predictionRange.low.toFixed(2)}</span>. Short-selling strategies are applicable.`;

                    // Chart SVG graphic matching exactly a 60 degree climbing or sliding slope
                    const chartIconSvg = isBullish 
                        ? `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 22 11 14 15 18 22 6"></polyline><polyline points="16 6 22 6 22 12"></polyline></svg>`
                        : `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 2 11 10 15 6 22 18"></polyline><polyline points="16 18 22 18 22 12"></polyline></svg>`;

                    // RENDER ACTIVE SELECTION ON LEFT WORKSTATION (Position 1 displays as primary)
                    if (index === 0) {
                        let quarterlyTableHtml = '';
                        if(item.quarterlyData) {
                            quarterlyTableHtml = `
                                <div class="mt-4 border border-gray-800/80 rounded-xl overflow-hidden bg-[#0d121f]">
                                    <div class="bg-[#131a2e] px-4 py-2 border-b border-gray-800 text-xs font-bold text-gray-300 flex items-center gap-2">
                                        <i class="fa-solid fa-table-list text-teal-400"></i> 5-Quarter Financials (पछले 5 क्वार्टर का नतीजा)
                                    </div>
                                    <div class="overflow-x-auto">
                                        <table class="w-full text-left text-xs font-mono">
                                            <thead class="bg-[#101626] text-gray-400 border-b border-gray-800">
                                                <tr>
                                                    <th class="p-3">Financial Metric (पैमाना)</th>
                                                    ${item.quarterlyData.quarters.map(q => `<th class="p-3 text-right">${q}</th>`).join('')}
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-gray-800/50">
                                                <tr>
                                                    <td class="p-3 font-sans text-gray-400">Total Net Revenue (कुल कमाई)</td>
                                                    ${item.quarterlyData.revenue.map(v => `<td class="p-3 text-right text-white font-semibold">₹${v} Cr</td>`).join('')}
                                                </tr>
                                                <tr class="bg-[#101626]/30">
                                                    <td class="p-3 font-sans text-gray-400">Net Profit - PAT (शुद्ध मुनाफा)</td>
                                                    ${item.quarterlyData.pat.map(v => `<td class="p-3 text-right text-emerald-400 font-semibold">₹${v} Cr</td>`).join('')}
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        }

                        mainPanel.innerHTML = `
                            <div class="bg-[#0f1524] border border-gray-800 rounded-2xl p-6 shadow-xl">
                                <div class="flex flex-col sm:flex-row justify-between sm:items-start gap-4 border-b border-gray-800 pb-4 mb-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-2">
                                            <span class="bg-gray-900 text-gray-400 font-mono text-xs px-2 py-0.5 rounded border border-gray-800 font-bold">${item.ticker}</span>
                                            <span class="text-xs text-gray-500 font-mono">ISIN: ${item.isin}</span>
                                        </div>
                                        <h2 class="text-2xl font-black text-white tracking-tight">${item.stockName}</h2>
                                        <p class="text-xs text-amber-400 font-medium flex items-center gap-1.5 pt-0.5">
                                            <i class="fa-solid fa-clock"></i> NSE Broadcast: 14-May-2026 | System Processed: 03-Jun-2026 08:00 AM
                                        </p>
                                    </div>
                                    <div class="bg-[#141c30] px-4 py-2 rounded-xl border border-gray-800/80 text-right">
                                        <span class="text-[10px] text-gray-400 block uppercase tracking-wider font-bold">Live Asset CMP</span>
                                        <span class="text-xl font-mono font-black text-white">₹${item.cmp.toFixed(2)}</span>
                                    </div>
                                </div>

                                <div class="p-4 rounded-xl border bg-[#111827]/80 ${alertBgClass} mb-4">
                                    <div class="flex items-center gap-3 mb-2">
                                        <span class="text-2xl font-black tracking-wide ${alertColorClass}">${alertTitle}</span>
                                        ${chartIconSvg}
                                    </div>
                                    <div class="blink-action text-base font-black tracking-wide ${alertColorClass} underline decoration-2 underline-offset-4">
                                        ${signalText}
                                    </div>
                                </div>

                                <div class="bg-[#131b2e] p-4 rounded-xl border border-gray-800/80 mb-4">
                                    <h4 class="text-xs font-bold text-teal-400 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                                        <i class="fa-solid fa-brain"></i> Expert Opinion (20+ Years Market Experience)
                                    </h4>
                                    <p class="text-sm text-gray-200 leading-relaxed font-medium">${expertOpinionText}</p>
                                </div>

                                <div class="space-y-3 bg-[#0d121f] p-4 rounded-xl border border-gray-800/60">
                                    <div>
                                        <span class="text-[10px] uppercase font-bold tracking-wider text-emerald-400 block mb-0.5">Official Disclosure (English)</span>
                                        <p class="text-xs text-gray-300 font-medium leading-relaxed">${item.triggerNewsEnglish}</p>
                                    </div>
                                    <div class="border-t border-gray-800/40 pt-2">
                                        <span class="text-[10px] uppercase font-bold tracking-wider text-indigo-400 block mb-0.5">सरल हिंदी विश्लेषण (Hindi Analysis)</span>
                                        <p class="text-xs text-indigo-200 font-medium leading-relaxed font-sans">${item.triggerNewsHindi}</p>
                                    </div>
                                </div>

                                <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div class="bg-[#131b2e]/40 p-3 rounded-xl border border-gray-800/50 text-xs font-mono">
                                        <div class="text-gray-400 font-sans font-bold mb-1">Benchmarking Comparison</div>
                                        <div class="flex justify-between"><span>Stock Momentum:</span><span class="${item.performance.stock >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${item.performance.stock}%</span></div>
                                        <div class="flex justify-between"><span>Sector Index:</span><span class="${item.performance.sector >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${item.performance.sector}%</span></div>
                                    </div>
                                    <div class="bg-[#131b2e]/40 p-3 rounded-xl border border-gray-800/50 text-xs font-mono">
                                        <div class="text-gray-400 font-sans font-bold mb-1">Microstructure Data</div>
                                        <div class="flex justify-between"><span>1W Delivery Volume:</span><span class="text-teal-400 font-bold">${item.deliveryPercentage}%</span></div>
                                        <div class="flex justify-between"><span>Institutional Flow:</span><span class="text-white">${item.institutionalHoldings.fii}% FII</span></div>
                                    </div>
                                </div>
                                ${quarterlyTableHtml}
                            </div>
                        `;
                    }

                    # RENDER STACKED CHRONOLOGY INSIDE THE RIGHT SIDEBAR
                    const positionNumber = index + 1;
                    const sidebarBorderColor = isBullish ? 'border-l-emerald-500' : 'border-l-rose-500';
                    const badgeText = isBullish ? 'BULLISH' : 'BEARISH';
                    const badgeColor = isBullish ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400';
                    
                    const sidebarCard = `
                        <div class="bg-[#131b2e]/70 border border-gray-800 border-l-4 ${sidebarBorderColor} p-3 rounded-xl relative transition-all duration-200 hover:bg-[#131b2e]">
                            ${index === 0 ? '<span class="absolute top-2 right-2 w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>' : ''}
                            <div class="flex justify-between items-center text-[10px] text-gray-500 font-mono font-bold">
                                <span>POS #${positionNumber} | ${positionNumber === 1 ? 'LATEST' : 'OLDER'}</span>
                                <span class="px-1.5 py-0.5 rounded text-[9px] ${badgeColor}">${badgeText}</span>
                            </div>
                            <h4 class="text-xs font-bold text-white mt-1 truncate">${item.ticker}</h4>
                            <p class="text-[11px] text-gray-400 mt-0.5 line-clamp-2">${item.triggerNewsEnglish}</p>
                        </div>
                    `;
                    sidebarStream.innerHTML += sidebarCard;
                });

            } catch (err) {
                console.error("Live sync intercept issue:", err);
            }
        }

        window.onload = () => {
            fetchTerminalUpdates();
            setInterval(fetchTerminalUpdates, 60000); // Live background loop executes every 60 seconds
        };
    </script>
</body>
</html>
