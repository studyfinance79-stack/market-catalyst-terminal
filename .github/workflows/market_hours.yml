name: Automated Mainboard Catalyst Sync

on:
  schedule:
    # Executes automatically at 08:15 AM Indian Standard Time (02:45 UTC) Monday - Friday
    - cron: '45 2 * * 1-5'
  workflow_dispatch: # Allows you to run the collector manually anytime

jobs:
  refresh-market-feed:
    runs-on: ubuntu-latest
    steps:
    - name: Access Repository Files
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: pip install requests

    - name: Run Mainboard Extraction Script
      run: python fetch_nse.py

    - name: Push Updated Datasets to Live Servers
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add premarket_feed.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Pre-Market Mainboard Feed Update [Skip CI]" && git push)
